<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nodo Feed Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a1a; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 24px; min-height: 100vh; }
    h1 { font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: #666; margin-bottom: 20px; }
    .card { background: #242424; border: 1px solid #333; border-radius: 12px; overflow: hidden; display: flex; margin-bottom: 12px; }
    .card.clickable { cursor: pointer; }
    .card.clickable:hover { border-color: #555; }
    .card img { width: 180px; object-fit: cover; flex-shrink: 0; }
    .card-body { padding: 24px 28px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .meta { display: flex; align-items: center; gap: 8px; }
    .tag { font-size: 10px; font-weight: 600; padding: 2px 10px; border-radius: 999px; }
    .tag.emerald { background: rgba(16,185,129,0.2); color: #34d399; }
    .tag.blue    { background: rgba(59,130,246,0.2); color: #60a5fa; }
    .tag.orange  { background: rgba(234,88,12,0.2);  color: #fb923c; }
    .tag.red     { background: rgba(239,68,68,0.2);  color: #f87171; }
    .date { font-size: 10px; color: #555; }
    .title { font-size: 15px; font-weight: 600; }
    .body-text { font-size: 13px; color: #999; line-height: 1.5; }
    .link-label { font-size: 12px; color: #fb923c; margin-top: 4px; }
    .count { color: #444; font-size: 12px; margin-bottom: 16px; }
    .error { color: #f87171; font-size: 13px; margin-top: 40px; text-align: center; }
  </style>
</head>
<body>
  <h1>Nodo — Feed Preview</h1>
  <div id="count" class="count"></div>
  <div id="feed"></div>
  <script>
    fetch('./feed.json?' + Date.now())
      .then(r => r.json())
      .then(items => {
        const container = document.getElementById('feed')
        const countEl = document.getElementById('count')
        if (!Array.isArray(items) || !items.length) { container.innerHTML = '<p class="error">Feed vacío.</p>'; return }
        countEl.textContent = items.length + ' item' + (items.length !== 1 ? 's' : '')
        items.forEach(item => {
          const div = document.createElement('div')
          div.className = 'card' + (item.link ? ' clickable' : '')
          if (item.link) div.onclick = () => window.open(item.link, '_blank')
          const tagClass = ['emerald','blue','orange','red'].includes(item.tagColor) ? item.tagColor : 'blue'
          div.innerHTML =
            (item.imageUrl ? '<img src="' + item.imageUrl + '" alt="' + item.title + '" />' : '') +
            '<div class="card-body"><div class="meta"><span class="tag ' + tagClass + '">' + (item.tag || 'Info') + '</span>' +
            (item.date ? '<span class="date">' + item.date + '</span>' : '') + '</div>' +
            '<p class="title">' + item.title + '</p><p class="body-text">' + item.body + '</p>' +
            (item.link ? '<span class="link-label">Leer más →</span>' : '') + '</div>'
          container.appendChild(div)
        })
      })
      .catch(err => { document.getElementById('feed').innerHTML = '<p class="error">Error: ' + err + '</p>' })
  </script>
</body>
</html>
